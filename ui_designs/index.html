<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>EcoLens 2.0 — Stitch AI UI Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "#0b1326",
            "surface-card": "#171f33",
            "primary": "#8ed5ff",
            "secondary": "#4edea3",
            "accent": "#38bdf8"
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface text-slate-200 min-h-screen flex flex-col font-sans">
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🌲</span>
      <div>
        <h1 class="text-lg font-bold bg-gradient-to-r from-emerald-400 to-sky-400 bg-clip-text text-transparent">EcoLens 2.0 — Stitch AI Prototype Showcase</h1>
        <p class="text-xs text-slate-400">Interactive High-Fidelity Design Artifacts</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="setDevice('mobile')" id="btn-m" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-sky-400 border border-slate-700 hover:bg-slate-700 flex items-center gap-1">
        <span class="material-symbols-outlined text-[16px]">smartphone</span> Mobile View (390px)
      </button>
      <button onclick="setDevice('desktop')" id="btn-d" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700 flex items-center gap-1">
        <span class="material-symbols-outlined text-[16px]">laptop</span> Fullscreen / Tab
      </button>
    </div>
  </header>

  <!-- Screen Switcher Tabs -->
  <div class="bg-slate-900/60 border-b border-slate-800 px-6 py-2 flex gap-2 overflow-x-auto">
    <button onclick="switchScreen('screen1_dashboard.html', this)" class="screen-tab px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition-all bg-sky-500/20 text-sky-300 border border-sky-500/30">
      <span class="material-symbols-outlined text-[18px]">grid_view</span> Screen 1: Dashboard
    </button>
    <button onclick="switchScreen('screen2_forest_ai.html', this)" class="screen-tab px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/60">
      <span class="material-symbols-outlined text-[18px]">forest</span> Screen 2: Forest AI
    </button>
    <button onclick="switchScreen('screen3_plant_scanner.html', this)" class="screen-tab px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/60">
      <span class="material-symbols-outlined text-[18px]">psychiatry</span> Screen 3: Plant Scanner
    </button>
    <button onclick="switchScreen('screen4_voice_assistant.html', this)" class="screen-tab px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/60">
      <span class="material-symbols-outlined text-[18px]">mic</span> Screen 4: Voice Assistant
    </button>
    <a id="open-new-tab" href="screen1_dashboard.html" target="_blank" class="ml-auto px-3 py-2 text-xs text-slate-400 hover:text-sky-400 flex items-center gap-1">
      <span>Open in new window</span>
      <span class="material-symbols-outlined text-[14px]">open_in_new</span>
    </a>
  </div>

  <!-- Interactive Device Viewport Frame -->
  <main class="flex-1 flex items-center justify-center p-4 bg-gradient-to-b from-slate-950 to-slate-900 overflow-hidden">
    <div id="frame-container" class="transition-all duration-300 shadow-[0_20px_60px_rgba(0,0,0,0.8)] border border-slate-700/60 rounded-[36px] overflow-hidden bg-black p-3 w-[414px] h-[860px]">
      <div class="relative w-full h-full rounded-[28px] overflow-hidden bg-[#0b1326]">
        <iframe id="preview-frame" src="screen1_dashboard.html" class="w-full h-full border-none"></iframe>
      </div>
    </div>
  </main>

  <script>
    let currentSrc = 'screen1_dashboard.html';
    let currentMode = 'mobile';

    function switchScreen(file, el) {
      currentSrc = file;
      document.getElementById('preview-frame').src = file;
      document.getElementById('open-new-tab').href = file;
      document.querySelectorAll('.screen-tab').forEach(t => {
        t.className = "screen-tab px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/60";
      });
      el.className = "screen-tab px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition-all bg-sky-500/20 text-sky-300 border border-sky-500/30";
    }

    function setDevice(mode) {
      currentMode = mode;
      const c = document.getElementById('frame-container');
      const bm = document.getElementById('btn-m');
      const bd = document.getElementById('btn-d');
      if (mode === 'mobile') {
        c.className = "transition-all duration-300 shadow-[0_20px_60px_rgba(0,0,0,0.8)] border border-slate-700/60 rounded-[36px] overflow-hidden bg-black p-3 w-[414px] h-[860px]";
        bm.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-sky-400 border border-slate-700 hover:bg-slate-700 flex items-center gap-1";
        bd.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700 flex items-center gap-1";
      } else {
        c.className = "transition-all duration-300 shadow-[0_20px_60px_rgba(0,0,0,0.8)] border border-slate-700/60 rounded-xl overflow-hidden bg-black p-1 w-full h-[90vh] max-w-6xl";
        bd.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-sky-400 border border-slate-700 hover:bg-slate-700 flex items-center gap-1";
        bm.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700 flex items-center gap-1";
      }
    }
  </script>
</body>
</html>
